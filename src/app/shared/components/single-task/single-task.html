<div
  class="group cursor-move bg-white rounded-lg mb-2 px-2.5 py-2 border border-slate-200 shadow-sm shadow-slate-300/60 transition hover:border-slate-300 hover:shadow-md"
>
  @if (taskData().tags.length > 0) {
    <div class="flex flex-wrap gap-1 mb-1.5">
      @for (tag of taskData().tags; track tag) {
        <span
          class="rounded px-2 py-0.5 text-[11px] font-medium leading-4 {{ tagColor(tag) }}"
          [title]="tag"
        >
          {{ tag }}
        </span>
      }
    </div>
  }

  <div class="flex items-start justify-between gap-2">
    <p class="min-w-0 flex-1 text-sm text-slate-700 wrap-break-word">
      {{ taskData().title }}
    </p>

    <div
      class="flex gap-2 shrink-0 opacity-0 transition-opacity group-hover:opacity-100 focus-within:opacity-100 pointer-coarse:opacity-100"
    >
      <button
        (click)="toggleEditModal(true)"
        class="text-sm font-extralight cursor-pointer group/edit"
        aria-label="Edit task"
      >
        <fa-icon [icon]="faEdit" class="group-hover/edit:text-sky-600" />
      </button>

      <app-confirm-btn
        [icon]="faTrash"
        message="Are you sure you want to delete this task?"
        (action)="delete()"
        btnClass="text-sm font-extralight cursor-pointer group/delete"
      >
        <fa-icon [icon]="faTrash" class="group-hover/delete:text-red-500" />
      </app-confirm-btn>
    </div>
  </div>

  @if (priority() || taskData().description) {
    <div class="flex items-center gap-2 mt-2 text-slate-400">
      @if (priority(); as priorityStyle) {
        <span
          class="inline-flex items-center gap-1.5 rounded px-1.5 py-0.5 text-[11px] font-medium {{
            priorityStyle.chip
          }}"
        >
          <span class="w-1.5 h-1.5 rounded-full {{ priorityStyle.dot }}"></span>
          {{ priorityStyle.label }}
        </span>
      }

      @if (taskData().description) {
        <fa-icon
          [icon]="faAlignLeft"
          class="text-xs"
          title="This card has a description"
          aria-label="This card has a description"
        />
      }
    </div>
  }
</div>

@if (openEditModal()) {
  <app-edit-modal
    [taskData]="taskData()"
    (onClose)="toggleEditModal(false)"
    (onSave)="updateTask.emit($event)"
  />
}
