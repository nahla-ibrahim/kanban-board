<div class="cursor-move flex justify-between items-center text-slate-600 bg-white p-2 rounded-md mb-2 border border-slate-200 shadow shadow-slate-300/80">
  <p>{{taskData().title}}</p>
  <div class="flex gap-2">
    <button (click)="toggleEditModal(true)" class="text-sm font-extralight cursor-pointer group">
      <fa-icon [icon]="faEdit" class="group-hover:text-sky-600" />
    </button>
    <app-confirm-btn 
      [icon]="faTrash" 
      message="Are you sure you want to delete this task?" 
      (action)="delete()"
      btnClass="text-sm font-extralight cursor-pointer group">
      <fa-icon [icon]="faTrash" class="group-hover:text-red-500" />
    </app-confirm-btn>
  </div>
</div>
@if(openEditModal()) {
  <app-edit-modal [taskData]="taskData()" (onClose)="toggleEditModal(false)" (onSave)="updateTask.emit($event)" />
}
