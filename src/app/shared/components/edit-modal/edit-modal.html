<div class="overflow-hidden fixed top-0 right-0 flex justify-center items-center w-screen h-screen bg-gray-900/70">
  <div class="relative p-4 w-full max-w-3xl">
    <div class="relative p-4 bg-white rounded-lg shadow">
      <button type="button"
        class="text-gray-400 absolute top-2 right-2 hover:text-gray-900 cursor-pointer"
        (click)="closeModal()">
        <fa-icon [icon]="faClose" />
        <span class="sr-only">Close modal</span>
      </button>

      <div>
        <h2 class="text-2xl font-medium text-gray-900">{{taskData().title}}</h2>
      </div>
    </div>
  </div>
</div>
