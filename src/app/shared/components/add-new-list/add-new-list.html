<div (clickOutside)="setListTitleInput(false)">
  @if (showListTitleInput()) { 
    <form class="bg-slate-50 p-3 w-60 rounded-lg" (submit)="addNewList($event)">
      <input type="text" #titleInput [field]="newListForm.title" class="bg-white rounded-md border border-slate-300 w-full px-2 py-1 mb-2 focus:outline-0 focus:border-sky-800/20 focus:shadow focus:shadow-sky-200" />
      <button type="submit" [disabled]="newListForm().invalid()" class="block bg-sky-800 hover:bg-sky-900 rounded-md text-white text-sm font-medium px-3 py-2 cursor-pointer">Add list</button>
    </form>
  } @else {
    <button (click)="setListTitleInput(true)" class="cursor-pointer bg-white/20 px-3 py-2 rounded-lg w-60 text-start text-white font-medium">
      <fa-icon [icon]="faPlus" /> Add new list
    </button>
  }
</div>
